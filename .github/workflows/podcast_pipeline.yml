name: NEJM Cardiology Podcast Automation

on:
  schedule:
    # 毎週月曜日 04:00 JST (日曜日 19:00 UTC)
    - cron: '0 19 * * 0'
  workflow_dispatch: # 手動実行用

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    permissions:
      contents: write # 履歴ファイルを更新するために必要

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        persist-credentials: true

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run pipeline
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        PUBMED_EMAIL: ${{ secrets.PUBMED_EMAIL }}
        G_CLIENT_ID: ${{ secrets.G_CLIENT_ID }}
        G_CLIENT_SECRET: ${{ secrets.G_CLIENT_SECRET }}
        G_REFRESH_TOKEN: ${{ secrets.G_REFRESH_TOKEN }}
        GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
        GMAIL_SENDER_ADDRESS: ${{ secrets.GMAIL_SENDER_ADDRESS }}
        GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        NOTIFICATION_RECIPIENT_EMAIL: ${{ secrets.NOTIFICATION_RECIPIENT_EMAIL }}
      run: python main.py

    - name: Commit and Push processed_articles.txt
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add -f outputs/processed_articles.txt
        # 変更がある場合のみコミット
        if ! git diff --cached --exit-code; then
          git commit -m "Update processed articles [skip ci]"
          git push
        else
          echo "No changes to commit"
        fi
